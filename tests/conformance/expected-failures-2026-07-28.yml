# The scenarios and checks of the official conformance runner, revision 2026-07-28, that the fixture server cannot
# pass yet. It serves tools (among them the ones that ask the client for input, with a prompt that does too, and the
# two that probe the client's capabilities and the stream of a call), resources, a resource template, prompts and
# completion, and the caching hints of their lists.
# An entry that starts to pass fails the run, so this list shrinks as the server grows.
server:
  # The scenario retries the call with correct answers (and some it did not ask for) but without the state that the
  # server issued with its request, and wants the call to end. The library takes answers only together with a state
  # it signed for the call, so it asks again, and the scenario, which only warns, counts that as a failure here.
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
