# serves tools (among them the ones that ask the client for sampling and for forms while they run), resources, a
# resource template, prompts and completion; it does not subscribe a client to the changes of a resource.
# An entry that starts to pass fails the run, so this list shrinks as the server grows.
server:
  - resources-subscribe
  - resources-unsubscribe
