name: CI

# Every push and pull request builds and tests on Linux x64 (GCC and Clang), with AddressSanitizer and
# UndefinedBehaviorSanitizer, and on Linux arm64 without them. macOS (arm64 and x64) and Windows (x64 and arm64) run on pushes to main and on
# demand, and on every event once the repository is public. One more job runs the stdio and HTTP servers against the
# official Python SDK's client, and one runs the official conformance suite against the HTTP server, once per revision.
# The README's two programs are built as a user builds them (the repository added as a subdirectory of another
# project) and run once: on Linux with Clang, and on Windows with MSVC, where the HTTP server's SIGTERM check is left out.
# The client's HTTP transport runs on libcurl from the system: the Linux jobs install it with apt, macOS with Homebrew and
# Windows with vcpkg; the jobs that build only servers configure without it (NEOMCP_HTTP_CLIENT=OFF), which shows that a
# server needs no libcurl. One more job runs the official conformance suite against the client fixture.
# One more job checks the translation of regular expressions for the schema keyword `pattern` against V8: Node writes
# patterns with the answers of V8, and a test executable compares the validator with them.
# One more job compares the wire data of every profile in profiles/ with the schema the protocol's specification
# publishes, read at the one commit that NOTICE names.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc, runner: ubuntu-24.04, cc: gcc, cxx: g++, sanitize: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" }
          - { name: linux-x64-clang, runner: ubuntu-24.04, cc: clang, cxx: clang++, sanitize: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" }
          # With the sanitizers the tests run many times slower on arm64 than on x64 and the suite no longer
          # finishes within the job's time limit, so the arm64 job builds without them; both x64 jobs run them.
          - { name: linux-arm64-gcc, runner: ubuntu-24.04-arm, cc: gcc, cxx: g++, sanitize: "" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      SANITIZE: ${{ matrix.sanitize }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libcurl (the client's HTTP transport)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          curl-config --version
      - name: Configure (Debug; sanitizers where the matrix names them)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEOMCP_WARNINGS_AS_ERRORS=ON
          -DNEOMCP_TEST_TIME_BOUNDS=OFF
          "-DCMAKE_C_FLAGS=$SANITIZE" "-DCMAKE_CXX_FLAGS=$SANITIZE"
      - name: Show the compilers and flags the build uses
        run: grep -E '^CMAKE_(C|CXX)_(COMPILER|FLAGS):' build/CMakeCache.txt
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  other-platforms:
    name: ${{ matrix.name }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x64, runner: macos-15-intel }
          - { name: windows-x64-msvc, runner: windows-2022 }
          - { name: windows-arm64-msvc, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libcurl (Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install curl
          prefix="$(brew --prefix curl)"
          "$prefix/bin/curl-config" --version
          echo "NEOMCP_CMAKE_EXTRA=-DCURL_ROOT=$prefix" >> "$GITHUB_ENV"
      - name: Install libcurl (vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TRIPLET: ${{ runner.arch == 'ARM64' && 'arm64-windows' || 'x64-windows' }}
        run: |
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "This runner image has no vcpkg (VCPKG_INSTALLATION_ROOT is not set)."
            exit 1
          fi
          root="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")"
          "$root/vcpkg" install "curl:$TRIPLET"
          "$root/vcpkg" list curl
          echo "NEOMCP_CMAKE_EXTRA=-DCMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=$TRIPLET" >> "$GITHUB_ENV"
      - name: Configure (Release)
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON ${NEOMCP_CMAKE_EXTRA:-}
      - name: Build
        # A fixed number of jobs: the option alone lets make start every compile at once, more than the memory
        # of a runner holds (the smallest, macOS arm64, has three cores).
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

  interop:
    name: interop-python-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Python SDK at the pinned versions
        run: |
          python -m venv "$RUNNER_TEMP/interop-venv"
          "$RUNNER_TEMP/interop-venv/bin/python" -m pip install -r tests/interop/requirements.txt
      - name: Install libcurl (the client's HTTP transport)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Configure (Release)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON
          -DNEOMCP_INTEROP_TESTS=ON "-DNEOMCP_INTEROP_PYTHON=$RUNNER_TEMP/interop-venv/bin/python"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      RUNNER_PACKAGE: "@modelcontextprotocol/conformance@0.2.0-alpha.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Configure (Release; the server only, without the client's HTTP transport)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON -DNEOMCP_HTTP_CLIENT=OFF
      - name: Build the fixture server
        run: cmake --build build --parallel 4 --target neomcp_conformance_fixture
      - name: Start the fixture server on a free port of 127.0.0.1
        id: fixture
        run: |
          build/tests/neomcp_conformance_fixture 0 2> "$RUNNER_TEMP/fixture.log" &
          for attempt in $(seq 1 100); do
            if [ -s "$RUNNER_TEMP/fixture.log" ]; then break; fi
            sleep 0.1
          done
          port="$(head -n 1 "$RUNNER_TEMP/fixture.log")"
          if [ -z "$port" ]; then
            echo "The fixture did not report its port."
            cat "$RUNNER_TEMP/fixture.log"
            exit 1
          fi
          echo "FIXTURE_URL=http://127.0.0.1:$port/mcp" >> "$GITHUB_ENV"
      # Both revisions run against the same process: one endpoint serves both eras.
      - name: Conformance, revision 2026-07-28
        run: >-
          npx --yes "$RUNNER_PACKAGE" server --url "$FIXTURE_URL" --requirements 2026-07-28
          --expected-failures tests/conformance/expected-failures-2026-07-28.yml
          --output-dir "$RUNNER_TEMP/results-2026-07-28"
      - name: Conformance, revision 2025-11-25
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: >-
          npx --yes "$RUNNER_PACKAGE" server --url "$FIXTURE_URL" --requirements 2025-11-25
          --expected-failures tests/conformance/expected-failures-2025-11-25.yml
          --output-dir "$RUNNER_TEMP/results-2025-11-25"
      - name: Show the fixture's log and every check that did not succeed
        if: ${{ failure() }}
        run: |
          echo "--- fixture log"
          cat "$RUNNER_TEMP/fixture.log" || true
          python3 -I tests/conformance/summarize_checks.py "$RUNNER_TEMP/results-2026-07-28" "$RUNNER_TEMP/results-2025-11-25"

  conformance-client:
    name: conformance-client
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      RUNNER_PACKAGE: "@modelcontextprotocol/conformance@0.2.0-alpha.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Before anything is judged: the client scenarios the pinned runner has, against those the expectations in
      # tests/conformance/client-scenarios.json were written for.
      - name: The client scenarios of the pinned runner
        run: |
          npx --yes "$RUNNER_PACKAGE" list --client | tee "$RUNNER_TEMP/client-scenarios.txt"
          for revision in 2025-11-25 2026-07-28; do
            npx --yes "$RUNNER_PACKAGE" list --requirements "$revision" | tee "$RUNNER_TEMP/requirements-$revision.txt"
          done
          python3 -I tests/conformance/summarize_checks.py --check-listing tests/conformance/client-scenarios.json \
            "2025-11-25=$RUNNER_TEMP/requirements-2025-11-25.txt" "2026-07-28=$RUNNER_TEMP/requirements-2026-07-28.txt"
      - name: Install libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON
      - name: Build the client fixture
        run: |
          cmake --build build --parallel 4 --target neomcp_conformance_client
          echo "FIXTURE=$GITHUB_WORKSPACE/build/tests/client_http/neomcp_conformance_client" >> "$GITHUB_ENV"
      # Gate (a): each revision's requirement set, with the scenarios that cannot pass yet as expected failures.
      - name: Conformance, revision 2025-11-25
        run: >-
          npx --yes "$RUNNER_PACKAGE" client --command "$FIXTURE --profiles=run" --requirements 2025-11-25
          --expected-failures tests/conformance/client-expected-failures-2025-11-25.yml
          --output-dir "$RUNNER_TEMP/requirements-2025-11-25"
      - name: Conformance, revision 2026-07-28
        if: ${{ !cancelled() }}
        run: >-
          npx --yes "$RUNNER_PACKAGE" client --command "$FIXTURE --profiles=run" --requirements 2026-07-28
          --expected-failures tests/conformance/client-expected-failures-2026-07-28.yml
          --output-dir "$RUNNER_TEMP/requirements-2026-07-28"
      # Gate (b): every scenario the fixture runs, alone at its revision, in both profile modes, without a baseline
      # (a single run then fails on a warning, a timeout or the client's exit status too).
      - name: Single runs of every scenario, in both profile modes
        if: ${{ !cancelled() }}
        run: |
          python3 -I tests/conformance/summarize_checks.py --list-runs tests/conformance/client-scenarios.json \
            > "$RUNNER_TEMP/runs.txt"
          while read -r mode revision scenario; do
            folder="$RUNNER_TEMP/single/$mode/$revision/$scenario"
            mkdir -p "$folder"
            status=0
            npx --yes "$RUNNER_PACKAGE" client --command "$FIXTURE --profiles=$mode" --scenario "$scenario" \
              --spec-version "$revision" --output-dir "$folder" > "$folder/runner.log" 2>&1 < /dev/null || status=$?
            echo "$status" > "$folder/exit-code"
            echo "$mode $revision $scenario: runner exited $status"
          done < "$RUNNER_TEMP/runs.txt"
      # Gate (c): what each single run reported, against the checks a passing run must have and the runs listed as
      # expected to fail.
      - name: Judge the single runs
        if: ${{ !cancelled() }}
        run: >-
          python3 -I tests/conformance/summarize_checks.py --client tests/conformance/client-scenarios.json
          "$RUNNER_TEMP/single"
      - name: Show every check that did not succeed
        if: ${{ failure() }}
        run: |
          python3 -I tests/conformance/summarize_checks.py "$RUNNER_TEMP/requirements-2025-11-25" "$RUNNER_TEMP/requirements-2026-07-28"
          for log in "$RUNNER_TEMP"/single/*/*/*/runner.log; do
            echo "--- $log"
            tail -n 40 "$log"
          done

  pattern-oracle:
    name: pattern-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (Release; without the client's HTTP transport, which the checker does not use)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON -DNEOMCP_HTTP_CLIENT=OFF
      - name: Build the checker
        run: cmake --build build --parallel 4 --target neomcp_pattern_oracle
      - name: Show the reference engine and its Unicode version
        run: |
          node --version
          node -p "'v8 ' + process.versions.v8 + ', unicode ' + process.versions.unicode"
      - name: The hand-written cases against V8
        run: node tests/pattern_oracle/generate.js --check tests/data/pattern_cases.json
      - name: The hand-written cases against the validator
        run: build/tests/neomcp_pattern_oracle tests/data/pattern_cases.json
      - name: Every general category against the characters whose category both engines agree on
        run: |
          node tests/pattern_oracle/generate.js --audit-properties --out "$RUNNER_TEMP/properties.json"
          build/tests/neomcp_pattern_oracle "$RUNNER_TEMP/properties.json"
      - name: Generated patterns against the validator (three seeds)
        run: |
          for seed in 11 22 33; do
            node tests/pattern_oracle/generate.js --seed "$seed" --count 20000 --out "$RUNNER_TEMP/cases-$seed.json"
            build/tests/neomcp_pattern_oracle "$RUNNER_TEMP/cases-$seed.json"
          done

  consumer:
    name: consumer-linux-clang
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The README's programs are the files that are compiled
        run: python3 -I tests/consumer/check_readme.py
      - name: Configure the consumer project against this checkout (Release; servers only, so no libcurl)
        run: >-
          cmake -S tests/consumer -B consumer-build -DCMAKE_BUILD_TYPE=Release "-DNEOMCP_SOURCE_DIR=$GITHUB_WORKSPACE"
          -DNEOMCP_HTTP_CLIENT=OFF
      - name: Show the compilers and flags the build uses
        run: grep -E '^CMAKE_(C|CXX)_(COMPILER|FLAGS):' consumer-build/CMakeCache.txt
      - name: Build
        run: cmake --build consumer-build --parallel 4
      - name: Run the stdio server on an initialize and a tool call
        run: python3 -I tests/consumer/check_stdio.py consumer-build/calc
      - name: Run the HTTP server on a tool call and stop it with SIGTERM
        run: python3 -I tests/consumer/check_http.py consumer-build/calc_http

  consumer-windows:
    name: consumer-windows-msvc
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Configure the consumer project against this checkout (servers only, so no libcurl)
        shell: bash
        run: cmake -S tests/consumer -B consumer-build "-DNEOMCP_SOURCE_DIR=${GITHUB_WORKSPACE//\\//}" -DNEOMCP_HTTP_CLIENT=OFF
      - name: Build (Release)
        run: cmake --build consumer-build --config Release --parallel 4
      - name: Run the stdio server on an initialize and a tool call
        run: python -I tests/consumer/check_stdio.py consumer-build/Release/calc.exe
      # Not run here: check_http.py ends the server with SIGTERM, which Python cannot send to a process on Windows
      # (terminate() there kills it without letting it exit by itself). The HTTP server is compiled and linked above,
      # and the listener's own tests run in the windows jobs of the main build.

  profile-wire:
    name: profile-wire
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The one place the specification's commit is named here. It must be the commit NOTICE gives.
      SPEC_COMMIT: d4b317231161ee96d3eefb2448bda4230c76f4c6
      SPEC_REPOSITORY: https://github.com/modelcontextprotocol/modelcontextprotocol.git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned commit is the one NOTICE names
        run: grep -F "$SPEC_COMMIT" NOTICE
      - name: Fetch the schema folder of the specification at the pinned commit
        run: |
          git clone --quiet --filter=blob:none --sparse --no-checkout "$SPEC_REPOSITORY" "$RUNNER_TEMP/spec"
          git -C "$RUNNER_TEMP/spec" sparse-checkout set --no-cone /schema/
          git -C "$RUNNER_TEMP/spec" checkout --quiet "$SPEC_COMMIT"
          test "$(git -C "$RUNNER_TEMP/spec" rev-parse HEAD)" = "$SPEC_COMMIT"
      - name: The wire data of each profile matches the schema of its revision
        run: |
          status=0
          for profile in profiles/*.json; do
            revision="$(basename "$profile" .json)"
            schema="$RUNNER_TEMP/spec/schema/$revision/schema.json"
            if [ ! -f "$schema" ]; then
              echo "::error file=$profile::the specification has no $schema"
              status=1
              continue
            fi
            if python3 -I tools/profile_wire.py "$schema" --check "$profile"; then
              echo "$profile matches schema/$revision/schema.json"
            else
              status=1
            fi
          done
          exit "$status"
