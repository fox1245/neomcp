name: CI

# Every push and pull request builds and tests on Linux x64 (GCC and Clang) and Linux arm64, with AddressSanitizer
# and UndefinedBehaviorSanitizer. macOS (arm64 and x64) and Windows (x64 and arm64) run on pushes to main and on
# demand, and on every event once the repository is public. One more job runs the stdio and HTTP servers against the
# official Python SDK's client, and one runs the official conformance suite against the HTTP server, once per revision.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc, runner: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { name: linux-x64-clang, runner: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: linux-arm64-gcc, runner: ubuntu-24.04-arm, cc: gcc, cxx: g++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (Debug, sanitizers)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEOMCP_WARNINGS_AS_ERRORS=ON
          -DNEOMCP_TEST_TIME_BOUNDS=OFF
          "-DCMAKE_C_FLAGS=$SANITIZE" "-DCMAKE_CXX_FLAGS=$SANITIZE"
      - name: Show the compilers and flags the build uses
        run: grep -E '^CMAKE_(C|CXX)_(COMPILER|FLAGS):' build/CMakeCache.txt
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  other-platforms:
    name: ${{ matrix.name }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x64, runner: macos-15-intel }
          - { name: windows-x64-msvc, runner: windows-2022 }
          - { name: windows-arm64-msvc, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

  interop:
    name: interop-python-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Python SDK at the pinned versions
        run: |
          python -m venv "$RUNNER_TEMP/interop-venv"
          "$RUNNER_TEMP/interop-venv/bin/python" -m pip install -r tests/interop/requirements.txt
      - name: Configure (Release)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON
          -DNEOMCP_INTEROP_TESTS=ON "-DNEOMCP_INTEROP_PYTHON=$RUNNER_TEMP/interop-venv/bin/python"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      RUNNER_PACKAGE: "@modelcontextprotocol/conformance@0.2.0-alpha.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEOMCP_WARNINGS_AS_ERRORS=ON
      - name: Build the fixture server
        run: cmake --build build --parallel --target neomcp_conformance_fixture
      - name: Start the fixture server on a free port of 127.0.0.1
        id: fixture
        run: |
          build/tests/neomcp_conformance_fixture 0 2> "$RUNNER_TEMP/fixture.log" &
          for attempt in $(seq 1 100); do
            if [ -s "$RUNNER_TEMP/fixture.log" ]; then break; fi
            sleep 0.1
          done
          port="$(head -n 1 "$RUNNER_TEMP/fixture.log")"
          if [ -z "$port" ]; then
            echo "The fixture did not report its port."
            cat "$RUNNER_TEMP/fixture.log"
            exit 1
          fi
          echo "FIXTURE_URL=http://127.0.0.1:$port/mcp" >> "$GITHUB_ENV"
      # Both revisions run against the same process: one endpoint serves both eras.
      - name: Conformance, revision 2026-07-28
        run: >-
          npx --yes "$RUNNER_PACKAGE" server --url "$FIXTURE_URL" --requirements 2026-07-28
          --expected-failures tests/conformance/expected-failures-2026-07-28.yml
          --output-dir "$RUNNER_TEMP/results-2026-07-28"
      - name: Conformance, revision 2025-11-25
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: >-
          npx --yes "$RUNNER_PACKAGE" server --url "$FIXTURE_URL" --requirements 2025-11-25
          --expected-failures tests/conformance/expected-failures-2025-11-25.yml
          --output-dir "$RUNNER_TEMP/results-2025-11-25"
      - name: Show the fixture's log and every check that did not succeed
        if: ${{ failure() }}
        run: |
          echo "--- fixture log"
          cat "$RUNNER_TEMP/fixture.log" || true
          python3 -I tests/conformance/summarize_checks.py "$RUNNER_TEMP/results-2026-07-28" "$RUNNER_TEMP/results-2025-11-25"
